    - Vector Read/Write: fiona-shapely/vector-read-write.md
    - Geoprocessing: fiona-shapely/geoprocessing.md
  - Google Earth Engine:
    - gee/index.md
    - Feature Layers: gee/feature-layers.md
    - Image Layers: gee/image-layers.md
  - Rasterio:
    - rasterio/index.md
    - Read Layer: rasterio/read-layer.md
